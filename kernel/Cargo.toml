[package]
name = "cairn-kernel"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "expose-field", "alloc"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }

[dev-dependencies]
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
